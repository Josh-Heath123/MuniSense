# Alembic (P2-10, ADR-0003). Run as the migration role:
#   uv run alembic upgrade head
# The database URL comes from MUNISENSE_MIGRATION_DATABASE_URL, checked by
# munisense.platform.settings (never from this file).
[alembic]
script_location = src/munisense/persistence/migrations
prepend_sys_path = src
path_separator = os

# Continuous integration (P0-6, ADR-0010): every pull request and every push to main
# runs the full check on a clean ubuntu-latest machine with PostgreSQL 17.
# Actions are pinned to full commit SHAs (supply chain); the tag is in the comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify and audit
    runs-on: ubuntu-latest
    # Keeps a stuck run from eating the free Actions allowance.
    timeout-minutes: 15
    env:
      # A stale uv.lock fails the run instead of being re-resolved on CI.
      UV_LOCKED: "1"
      # Same variable as in the example settings file; read by database tests from P2.
      MUNISENSE_TEST_DATABASE_URL: postgresql://munisense:ci-only-not-a-secret@localhost:5432/munisense_test
    services:
      postgres:
        # Pinned by digest (multi-arch index of postgres:17, 17.12 on 2026-11-17).
        image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
        env:
          # CI-only throwaway credentials for a database that lives for one run.
          POSTGRES_USER: munisense
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: munisense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U munisense -d munisense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so gitleaks scans every commit.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Install Python 3.13 and the locked dev dependencies
        run: uv sync

      - name: Check the database service is reachable
        run: pg_isready -h localhost -p 5432 -U munisense -d munisense_test

      - name: pre-commit file checks and ruff on all files
        # gitleaks runs as its own step below (the hook scans staged changes only).
        env:
          SKIP: gitleaks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: No in-repository gitleaks allowlists
        # A config file, ignore file or inline allow comment would let a pull request
        # silence secret scanning; adding one needs the owner's approval.
        run: |
          for f in .gitleaks.toml .gitleaksignore; do
            if [ -e "$f" ]; then echo "::error::$f found: needs the owner's approval"; exit 1; fi
          done
          if git grep -n "gitleaks:allow" -- ':!.github/workflows/ci.yml'; then
            echo "::error::inline gitleaks:allow found: needs the owner's approval"; exit 1
          fi

      - name: gitleaks on the full history
        run: >-
          docker run --rm --network none -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

      - name: uv run poe verify
        run: uv run poe verify

      - name: uv run poe audit
        run: uv run poe audit
